server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Written by docker-entrypoint.d/40-runtime-config.sh on every container
    # start; it tells the bundle which API to call, so it must never be cached.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # Vite fingerprints everything under /assets/, so these can be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # A cached index.html would keep asking for chunks a new build removed.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
